# ──────────────────────────────────────────────
# Common config (shared by all profiles)
# ──────────────────────────────────────────────
spring:
  profiles:
    active: prod

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: weekly-sentiment-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: com.amakeit.journalApp.model

    properties:
      security:
        protocol: SASL_SSL
      sasl:
        mechanism: PLAIN
        jaas:
          config: ${SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG}

logging:
  level:
    com.amakeit.journalApp: DEBUG

weather:
  api:
    key: ${WEATHER_API_KEY}

---
# ──────────────────────────────────────────────
# DEV profile
# ──────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: dev

  application:
    name: journal App

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
      database: journaldb
      auto-index-creation: true

server:
  port: 8080

---
# ──────────────────────────────────────────────
# PROD profile
# ──────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: prod

  application:
    name: journal App

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
      database: journaldb
      auto-index-creation: true

server:
  port: 8080
